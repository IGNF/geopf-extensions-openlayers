{{#extend "ol-sample-modules-dsfr-layout"}}

{{#content "vendor"}}
        <link rel="stylesheet" href="{{ baseurl }}/dist/modules/GpfExtOlCatalog.css" />
        <script src="{{ baseurl }}/dist/modules/GpfExtOlCatalog.js"></script>
{{/content}}

{{#content "head"}}
        <title>Sample OpenLayers LayerCatalog - Producteurs</title>
{{/content}}

{{#content "style"}}
        <style>
            div#map {
                width: 100%;
                height: 500px;
                background-image:url("{{ resources }}/geoportail-waiting.gif");
                background-position:center center;
                background-repeat:no-repeat;
            }
        </style>
{{/content}}

{{#content "body"}}
            <h2>Catalogue de couches</h2>
            <div id="map">
            </div>
{{/content}}

{{#content "js"}}
            <script type="text/javascript">
                if (window.Gp) {
                    Gp.Logger.enableAll();
                }
                var map;
                var createMap = function() {
                    document.getElementById("map").style.backgroundImage = "none";

                    map = new ol.Map({
                        target : "map",
                        layers : [
                            new ol.layer.Tile({
                                source : new ol.source.OSM(),
                                opacity : 0.5
                            })
                        ],
                        view : new ol.View({
                            center : [288074.8449901076, 6247982.515792289],
                            zoom : 8
                        })
                    });

                    var catalog = new ol.control.Catalog({
                        position : "top-left",
                        collapsed : false,
                        categories : [
                            {
                                title : "Données",
                                id : "data",
                                default : true,
                                producer : false,
                                order : true,
                                filter : null
                            },
                            {
                                title : "Services",
                                id : "services",
                                items : [
                                    {
                                        title : "WMTS",
                                        id : "wmts",
                                        default : true,
                                        producer : true,
                                        order : true,
                                        filter : {
                                            field : "service",
                                            value : "WMTS"
                                        }
                                    },
                                    {
                                        title : "WMS",
                                        id : "wms",
                                        producer : false,
                                        order : true,
                                        filter : {
                                            field : "service",
                                            value : "WMS"
                                        }
                                    }
                                ]
                            }
                        ]
                    });
                    map.addControl(catalog);
                };
                Gp.Services.getConfig({
                    customConfigFile : "{{ configurl }}",
                    callbackSuffix : "",
                    timeOut : 20000,
                    onSuccess : createMap,
                    onFailure : (error) => {
                        console.error(error);
                    }
                });
            </script>
{{/content}}

{{/extend}}
